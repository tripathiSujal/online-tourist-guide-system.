{% extends "base.html" %}
{% block content %}
<div class="auth">
  <h2>{{ 'Create account' if mode == 'register' else 'Login' }}</h2>
  <form method="post">
    {% if mode == 'register' %}<input name="name" placeholder="Full name" required>{% endif %}
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password (6+ chars)" required>
    <button class="btn">{{ 'Sign up' if mode == 'register' else 'Login' }}</button>
  </form>
  {% if mode == 'login' %}<p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  {% else %}<p class="muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p>{% endif %}
</div>
{% endblock %}
